name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix wolfmarkdown
      - run: npm test
      - run: npx --yes skills-ref validate ./wolfmarkdown
      - run: node wolfmarkdown/scripts/verify-markdown.mjs examples/mobile-app-migration/output.md --integrity-from examples/mobile-app-migration/input.md
