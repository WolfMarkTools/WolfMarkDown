name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix wolfmarkdown
      - run: npm test
      - run: npx --yes skills-ref@0.1.5 validate ./wolfmarkdown
      - run: node wolfmarkdown/scripts/verify-markdown.mjs examples/mobile-app-migration/output.md --integrity-from examples/mobile-app-migration/input.md
